[project]
name = "kmshare"
version = "0.4.0"
description = "Share one Windows PC's keyboard and mouse with another over the LAN (encrypted, shared key)."
requires-python = ">=3.10"
dependencies = ["pynput>=1.7.6", "cryptography>=42"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".dev/pytest_cache"
