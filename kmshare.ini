; kmshare settings, shared by both roles. Restart kmshare after editing.
; The shared key is NOT stored here: it is typed at every launch.

[network]
; TCP port the server listens on and the client connects to (same on both PCs).
port = 24800
; server: local address to listen on (0.0.0.0 = all network adapters).
bind = 0.0.0.0
; client: IP or host name of the server PC (the one whose keyboard/mouse is shared).
; Leave empty to be asked at launch. An address typed there can be saved to
; kmshare.local.ini (this PC only, ignored by git), whose values override this file.
server_host =

[hotkey]
; server: switches keyboard/mouse between this PC and the client.
; Modifiers: ctrl, shift, alt, win.  Keys: a-z, 0-9, f1-f24, space, tab, home, end, insert, ...
toggle = ctrl+shift+f12

[features]
; Edge switching: push the cursor past the screen edge to move to the other PC.
; false = hotkey only (the server then doesn't ask where the client is).
edge_switch = true
; Clipboard: text copied on one PC is there to paste on the other after control switches.
; Both PCs must have it on. Plain text only; what's on the clipboard at launch isn't sent.
clipboard = true

[clipboard]
; Largest clipboard text sent or accepted, in KB (bigger is skipped and logged).
max_kb = 1024

[layout]
; Server: default answer when a client connects and you're asked where it sits
; relative to this PC: left, right, top or bottom.
client_side = right
; Server: edge-switching safeguards (the client uses the server's values).
; Push this many pixels past the edge in total before switching.
edge_push = 8
; ...and keep pushing at least this long, in ms (0 = switch as soon as edge_push is reached).
edge_delay_ms = 0
; No switching within this many pixels of either end of an edge (keeps corners usable).
edge_corner = 40
; After a switch, move this many pixels away from the edge before it can switch again.
edge_rearm = 20

[misc]
; Play a system sound when control switches.
beep = true
; Keep-alive: seconds between pings, and seconds of silence before the link is dropped
; (on drop the server returns to LOCAL and the client releases any held keys).
ping_interval = 2
peer_timeout = 6
