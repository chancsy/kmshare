; kmshare settings, shared by both roles. Restart kmshare after editing.
; The shared key is NOT stored here: it is typed at every launch.

[network]
; TCP port the server listens on and the client connects to (same on both PCs).
port = 24800
; server: local address to listen on (0.0.0.0 = all network adapters).
bind = 0.0.0.0
; client: IP or host name of the server PC (the one whose keyboard/mouse is shared).
; Leave empty to be asked at launch.
server_host =

[hotkey]
; server: switches keyboard/mouse between this PC and the client.
; Modifiers: ctrl, shift, alt, win.  Keys: a-z, 0-9, f1-f24, space, tab, home, end, insert, ...
toggle = ctrl+shift+f12

[misc]
; Play a system sound when control switches.
beep = true
; Keep-alive: seconds between pings, and seconds of silence before the link is dropped
; (on drop the server returns to LOCAL and the client releases any held keys).
ping_interval = 2
peer_timeout = 6
